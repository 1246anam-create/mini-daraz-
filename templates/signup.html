{% extends "base.html" %}
{% block title %}Sign Up - Mini Daraz{% endblock %}
{% block content %}
<section class="py-5">
    <div class="container">
        <div class="auth-box">
            <h3 class="text-center mb-4">Create Account</h3>
            <form method="post" action="{{ url_for('signup') }}">
                <div class="mb-3"><label class="form-label">Full Name</label><input name="full_name" class="form-control" required value="{{ form.get('full_name','') if form else '' }}"></div>
                <div class="mb-3"><label class="form-label">Email</label><input name="email" type="email" class="form-control" required value="{{ form.get('email','') if form else '' }}"></div>
                <div class="mb-3"><label class="form-label">Phone</label><input name="phone" class="form-control" required value="{{ form.get('phone','') if form else '' }}"></div>
                <div class="mb-3"><label class="form-label">Password</label><input name="password" type="password" class="form-control" required></div>
                <div class="mb-3"><label class="form-label">Confirm Password</label><input name="confirm_password" type="password" class="form-control" required></div>
                <button class="btn btn-primary w-100">Sign Up</button>
            </form>
            <p class="text-center mt-3">Already have an account? <a href="{{ url_for('login', next=request.args.get('next')) }}">Login</a></p>
        </div>
    </div>
</section>
{% endblock %}
