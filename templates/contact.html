{% extends "base.html" %}
{% block title %}Contact Us - Mini Daraz{% endblock %}
{% block content %}
<section class="py-5">
    <div class="container">
        <h2 class="mb-4">Contact Us</h2>
        <div class="row">
            <div class="col-md-6">
                <form method="post" action="{{ url_for('contact') }}">
                    <div class="mb-3"><label class="form-label">Name</label><input name="full_name" class="form-control" required></div>
                    <div class="mb-3"><label class="form-label">Email</label><input name="email" type="email" class="form-control" required></div>
                    <div class="mb-3"><label class="form-label">Phone</label><input name="phone" class="form-control"></div>
                    <div class="mb-3"><label class="form-label">Subject</label><input name="subject" class="form-control" required></div>
                    <div class="mb-3"><label class="form-label">Message</label><textarea name="message" class="form-control" required></textarea></div>
                    <button class="btn btn-primary">Send Message</button>
                </form>
            </div>
            <div class="col-md-6">
                <h5>Our Information</h5>
                <p><i class="fas fa-map-marker-alt"></i> Karachi, Pakistan</p>
                <p><i class="fas fa-phone"></i> 0300-1234567</p>
                <p><i class="fas fa-envelope"></i> support@minidaraz.com</p>
                <p>We typically respond within 24 hours.</p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
