{% extends "admin/base.html" %}
{% block title %}Add Product - Admin{% endblock %}
{% block content %}
<h2 class="mb-3">Add Product</h2>
<div class="card"><div class="card-body">
    <form method="post" action="{{ url_for('admin_add_product') }}" enctype="multipart/form-data">
        <div class="row">
            <div class="col-md-6 mb-3"><label class="form-label">Name</label><input name="name" class="form-control" required></div>
            <div class="col-md-6 mb-3"><label class="form-label">Brand</label><input name="brand" class="form-control"></div>
            <div class="col-md-6 mb-3"><label class="form-label">Category</label><select name="category_id" class="form-select" required>{% for c in categories %}<option value="{{ c['id'] }}">{{ c['name'] }}</option>{% endfor %}</select></div>
            <div class="col-md-3 mb-3"><label class="form-label">Price (Rs.)</label><input name="price" type="number" step="0.01" class="form-control" required></div>
            <div class="col-md-3 mb-3"><label class="form-label">Discount %</label><input name="discount" type="number" class="form-control" value="0"></div>
            <div class="col-md-4 mb-3"><label class="form-label">Stock</label><input name="stock" type="number" class="form-control" value="0"></div>
            <div class="col-md-4 mb-3"><label class="form-label">Status</label><select name="status" class="form-select"><option value="active">Active</option><option value="inactive">Inactive</option></select></div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Product Image (Upload)</label>
                <input name="image" id="image" type="file" class="form-control" accept="image/jpg,image/jpeg,image/png,image/webp">
                <small class="text-muted">Allowed: JPG, JPEG, PNG, WEBP (max 5 MB). Leave empty to use the default image.</small>
                <div class="mt-2">
                    <img id="image-preview" src="{{ url_for('static', filename='images/products/default-product.svg') }}" alt="Preview" style="max-height:120px; border:1px solid #ddd; border-radius:8px; padding:4px;">
                </div>
            </div>
        </div>
        <div class="mb-3"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="3"></textarea></div>
        <div class="mb-3"><label class="form-label">Specifications (one per line: Key: Value)</label><textarea name="specifications" class="form-control" rows="4"></textarea></div>
        <div class="mb-3">
            <div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" name="is_flash_sale" value="1"> <label class="form-check-label">Flash Sale</label></div>
            <div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" name="is_new" value="1"> <label class="form-check-label">New</label></div>
            <div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" name="is_best_seller" value="1"> <label class="form-check-label">Best Seller</label></div>
            <div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" name="is_trending" value="1"> <label class="form-check-label">Trending</label></div>
        </div>
        <button class="btn btn-primary">Save Product</button>
        <a href="{{ url_for('admin_products') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div></div>
{% endblock %}
