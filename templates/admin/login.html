<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Mini Daraz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>body{background:#1f2937;display:flex;align-items:center;justify-content:center;min-height:100vh}.card{width:380px}.brand{color:#f57224;font-weight:700}</style>
</head>
<body>
<div class="card p-4">
    <h3 class="text-center mb-3"><span class="brand">Mini Daraz</span> Admin</h3>
    {% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}{% for c,m in messages %}<div class="alert alert-{{ c }}">{{ m }}</div>{% endfor %}{% endif %}{% endwith %}
    <form method="post" action="{{ url_for('admin_login') }}">
        <div class="mb-3"><label class="form-label">Email</label><input name="email" type="email" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">Password</label><input name="password" type="password" class="form-control" required></div>
        <button class="btn btn-primary w-100">Login</button>
    </form>
    <p class="text-center mt-3"><a href="{{ url_for('index') }}">Back to Site</a></p>
</div>
</body>
</html>
