{% extends "base.html" %}
{% block title %}My Account - Mini Daraz{% endblock %}
{% block content %}
<section class="py-4">
    <div class="container">
        <h2 class="mb-4">My Account</h2>
        <div class="row">
            <div class="col-md-4">
                <div class="card mb-3"><div class="card-body text-center">
                    <div class="avatar-circle mb-2"><i class="fas fa-user"></i></div>
                    <h5>{{ user['full_name'] }}</h5>
                    <p class="text-muted">{{ user['email'] }}</p>
                </div></div>
                <div class="list-group">
                    <a href="{{ url_for('orders') }}" class="list-group-item"><i class="fas fa-box"></i> My Orders</a>
                    <a href="{{ url_for('wishlist') }}" class="list-group-item"><i class="far fa-heart"></i> Wishlist</a>
                    <a href="{{ url_for('logout') }}" class="list-group-item"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card mb-3"><div class="card-body">
                    <h5>Profile Information</h5>
                    <form method="post" action="{{ url_for('profile') }}">
                        <div class="mb-3"><label class="form-label">Full Name</label><input name="full_name" class="form-control" value="{{ user['full_name'] or '' }}"></div>
                        <div class="mb-3"><label class="form-label">Phone</label><input name="phone" class="form-control" value="{{ user['phone'] or '' }}"></div>
                        <div class="mb-3"><label class="form-label">Address</label><textarea name="address" class="form-control">{{ user['address'] or '' }}</textarea></div>
                        <div class="row">
                            <div class="col-6 mb-3"><label class="form-label">City</label><input name="city" class="form-control" value="{{ user['city'] or '' }}"></div>
                            <div class="col-6 mb-3"><label class="form-label">Postal Code</label><input name="postal_code" class="form-control" value="{{ user['postal_code'] or '' }}"></div>
                        </div>
                        <button class="btn btn-primary">Update Profile</button>
                    </form>
                </div></div>
                <div class="card"><div class="card-body">
                    <h5>Change Password</h5>
                    <form method="post" action="{{ url_for('change_password') }}">
                        <div class="mb-3"><label class="form-label">Current Password</label><input name="current_password" type="password" class="form-control"></div>
                        <div class="mb-3"><label class="form-label">New Password</label><input name="new_password" type="password" class="form-control"></div>
                        <div class="mb-3"><label class="form-label">Confirm Password</label><input name="confirm_password" type="password" class="form-control"></div>
                        <button class="btn btn-primary">Change Password</button>
                    </form>
                </div></div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
