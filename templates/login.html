{% extends "base.html" %}
{% block title %}Login - Mini Daraz{% endblock %}
{% block content %}
<section class="py-5">
    <div class="container">
        <div class="auth-box">
            <h3 class="text-center mb-4">Login</h3>
            <form method="post" action="{{ url_for('login') }}">
                <div class="mb-3"><label class="form-label">Email</label><input name="email" type="email" class="form-control" required></div>
                <div class="mb-3"><label class="form-label">Password</label><input name="password" type="password" class="form-control" required></div>
                <button class="btn btn-primary w-100">Login</button>
            </form>
            <p class="text-center mt-3">Don't have an account? <a href="{{ url_for('signup') }}">Sign up</a></p>
            <p class="text-center"><a href="{{ url_for('admin_login') }}"><i class="fas fa-lock"></i> Admin Login</a></p>
        </div>
    </div>
</section>
{% endblock %}
